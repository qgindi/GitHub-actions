name: Create Release with Assets
on:
  push:
    tags:
      - "v*.*"
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: echo ${{ github.sha }} > Release.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: Release.txt
